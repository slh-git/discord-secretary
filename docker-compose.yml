services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-discord_secretary}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
            POSTGRES_DB: ${POSTGRES_DB:-discord_secretary}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-discord_secretary} -d ${POSTGRES_DB:-discord_secretary}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    api:
        image: node:22-alpine
        restart: unless-stopped
        working_dir: /app
        volumes:
            - .:/app
            - api_node_modules:/app/node_modules
        command: sh -c "npm install && npm run dev --workspace=apps/api"
        env_file:
            - path: .env
              required: false
        environment:
            DATABASE_URL: postgresql://${POSTGRES_USER:-discord_secretary}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-discord_secretary}
            API_HOST: 0.0.0.0
            API_PORT: ${API_PORT:-3000}
        ports:
            - "${API_PORT:-3000}:${API_PORT:-3000}"
        depends_on:
            postgres:
                condition: service_healthy

    discord:
        image: node:22-alpine
        restart: unless-stopped
        working_dir: /app
        volumes:
            - .:/app
            - discord_node_modules:/app/node_modules
        command: sh -c "npm install && npm run dev --workspace=apps/discord"
        env_file:
            - path: .env
              required: false
        environment:
            API_BASE_URL: http://api:${API_PORT:-3000}
        depends_on:
            - api

volumes:
    postgres_data:
    api_node_modules:
    discord_node_modules:
